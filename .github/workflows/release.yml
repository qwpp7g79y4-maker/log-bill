name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt, clippy and tests on every OS and on Rust 1.85, on the tag commit.
  # No binary is built and no release is made unless all of them pass.
  checks:
    uses: ./.github/workflows/ci.yml

  # cargo-about has no prebuilt binary for every runner, so the license
  # file is generated once here and shared with every build.
  licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@v7
        with:
          name: licenses
          path: THIRD-PARTY-LICENSES.html

  build:
    name: Build ${{ matrix.target }}
    needs: [checks, licenses]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 22.04: the binary needs glibc 2.34 or newer (GLIBC_2.34 symbols).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Statically linked: no glibc version needed, also runs on Alpine.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # Copyright and license texts of the third-party crates in the binary,
      # generated once on Linux by the licenses job.
      - uses: actions/download-artifact@v8
        with:
          name: licenses
      - name: Package
        shell: bash
        run: |
          name="log-bill-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # Everything the README links to with a relative link, so the links
          # and the quick start examples work inside the archive.
          cp README.md README.nl.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.html CHANGELOG.md CONTRIBUTING.md SECURITY.md QUALITY.md QUALITY.nl.md "dist/$name/"
          mkdir -p "dist/$name/docs" "dist/$name/tests"
          cp docs/*.md "dist/$name/docs/"
          cp -R tests/fixtures "dist/$name/tests/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "../target/${{ matrix.target }}/release/log-bill.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "../target/${{ matrix.target }}/release/log-bill" "$name/"
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          rm -rf "$name"
      - name: Smoke
        shell: bash
        run: |
          name="log-bill-${GITHUB_REF_NAME}-${{ matrix.target }}"
          smoke=$(mktemp -d)
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z x -y "dist/$name.zip" -o"$smoke" > /dev/null
          else
            tar -xzf "dist/$name.tar.gz" -C "$smoke"
          fi
          root="$smoke/$name"
          test -f "$root/QUALITY.md"
          test -f "$root/QUALITY.nl.md"
          test -f "$root/README.md"
          test -f "$root/README.nl.md"
          test -f "$root/LICENSE-MIT"
          test -f "$root/LICENSE-APACHE"
          test -f "$root/THIRD-PARTY-LICENSES.html"
          test -f "$root/CHANGELOG.md"
          test -f "$root/CONTRIBUTING.md"
          test -f "$root/SECURITY.md"
          test -f "$root/docs/reference.md"
          test -f "$root/docs/reference.nl.md"
          test -f "$root/tests/fixtures/README.md"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '*-*'
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --title "log-bill $GITHUB_REF_NAME" --notes-file ../notes.md --verify-tag ./*
