name: CI

on:
  push:
  pull_request:
  # The release workflow runs these same checks on the tag commit first.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}, stable)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; macos-15-intel is the Intel (x86_64) Mac.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      # The JSON tests check the output with Python's json module.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked

  msrv:
    name: Test (ubuntu-latest, Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked

  musl:
    name: Test (ubuntu-22.04, musl and glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the musl target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --target x86_64-unknown-linux-musl
      - name: Build the release gnu binary
        run: cargo build --release --locked
      - name: GLIBC is at most 2.35
        run: |
          python3 - << 'PY'
          import re
          import subprocess
          import sys

          text = subprocess.check_output(
              ["objdump", "-T", "target/release/log-bill"], text=True
          )
          found = re.findall(r"GLIBC_([0-9]+(?:\.[0-9]+)*)", text)
          if not found:
              sys.exit("no GLIBC symbols in target/release/log-bill")

          def key(version):
              parts = [int(part) for part in version.split(".")]
              return tuple(parts + [0] * (3 - len(parts)))

          highest = max(found, key=key)
          print(f"highest GLIBC_{highest}")
          if key(highest) > (2, 35, 0):
              sys.exit(f"GLIBC_{highest} is newer than 2.35")
          PY

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
