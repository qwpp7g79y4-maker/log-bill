[package]
name = "log-bill-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
tempfile = "3"
serde_json = "1"

[dependencies.log-bill]
path = ".."

[[bin]]
name = "fuzz_read"
path = "fuzz_targets/fuzz_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_rules"
path = "fuzz_targets/fuzz_rules.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_mask"
path = "fuzz_targets/fuzz_mask.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_money"
path = "fuzz_targets/fuzz_money.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_diff"
path = "fuzz_targets/fuzz_diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_render"
path = "fuzz_targets/fuzz_render.rs"
test = false
doc = false
bench = false
