# cargo-deny configuration. CI runs `cargo deny check licenses`.
# Only permissive licenses are allowed; copyleft or unknown licenses fail CI.
[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
