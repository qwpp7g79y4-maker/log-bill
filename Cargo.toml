[package]
name = "log-bill"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["PEPAI <pep_ai@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Offline estimate of log costs per pattern"
repository = "https://github.com/qwpp7g79y4-maker/log-bill"
readme = "README.md"
keywords = ["logs", "logging", "cost", "observability", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", ".gitattributes", "fuzz/"]

[dependencies]
aho-corasick = "1"
clap = { version = "4.5", features = ["derive"] }
regex = "1"
regex-syntax = "0.8"
serde_json = "1"
unicode-normalization = "0.1.25"
unicode-security = "0.1.2"

[dev-dependencies]
# 1.7 is the newest release whose own rust-version does not exceed this
# package's MSRV (1.85); newer proptest releases require Rust 1.88.
proptest = "=1.7.0"
tempfile = "3"
